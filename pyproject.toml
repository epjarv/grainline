[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grainline"
description = "Wood-grain hotend temperatures for sliced 3D-printing G-code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "epjarv" }]
dependencies = ["customtkinter>=5.2.2"]
dynamic = ["version"]

[project.optional-dependencies]
build = ["pyinstaller>=6.11", "pillow>=10.4"]
windows = ["windnd>=1.0.7"]

[project.scripts]
grainline = "grainline.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "grainline.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
